{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}My App{{ end }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        /* Header */
        header {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Main content */
        main {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .content {
            background-color: white;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        h1, h2, h3 {
            margin-top: 0;
            color: #111827;
        }

        p {
            line-height: 1.6;
            color: #4b5563;
        }

        /* Footer */
        footer {
            max-width: 1100px;
            margin: 40px auto 0;
            padding: 20px 24px;
            color: #6b7280;
            font-size: 14px;
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav {
                padding: 0 12px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 14px;
            }

            main {
                margin-top: 20px;
                padding: 0 12px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="/">Home</a>
        <a href="/sensor">Sensor</a>
    </nav>
</header>

<main>
    <div class="content">
        {{ block "content" . }}{{ end }}
    </div>
</main>

<footer>
    {{ block "footer" . }}{{ end }}
</footer>
</body>
</html>
{{ end }}
